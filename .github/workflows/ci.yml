name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun run type-check
      - name: Secretos de prueba
        run: |
          printf 'BETTER_AUTH_SECRET=%s\nCRED_KEK_V1=%s\n' "$(openssl rand -base64 32)" "$(openssl rand -base64 32)" > server/.dev.vars
      - run: bun run test
